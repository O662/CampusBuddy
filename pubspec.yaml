name: campus_buddy
description: "A student productivity app for tracking grades, planning tasks, and studying."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  table_calendar: ^3.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  percent_indicator: ^4.2.3
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
